name = "sociotype-app"
main = "worker/index.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Сховище статистики. Cloudflare створить його сам під час деплою (потрібен свіжий wrangler).
[[kv_namespaces]]
binding = "USAGE"

[vars]
CHAT_LIMIT = "20"
